label: 'Palveluntuottajan vastuupäivittäjä'
description: 'Valitse palvelulle vastuupäivittäjä, joka on nimetty palvelun omistajaksi. Vastuupäivittäjä ylläpitää palvelun tietoja ja saa palvelua koskevat järjestelmän ilmoitukset sähköpostiinsa. Työllisyysalueen omissa palveluissa palveluntuottajan ja kunnan vastuupäivittäjä voivat olla sama henkilö.'
