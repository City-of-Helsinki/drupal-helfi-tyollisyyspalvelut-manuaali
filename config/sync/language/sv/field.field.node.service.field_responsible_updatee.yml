label: 'Kommunens ansvarsperson för uppdatering'
description: 'Välj kommunens ansvarsperson för uppdatering av tjänsten. Personen utarbetar anvisningar för sakkunniga, godkänner ändringar som serviceproducenten har gjort och publicerar tjänsten. Serviceproducentens och kommunens ansvarsperson för uppdatering kan vara samma person när det gäller sysselsättningsområdets egna tjänster.'
