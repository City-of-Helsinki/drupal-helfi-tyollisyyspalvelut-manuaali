label: 'Serviceproducentens ansvarsperson för uppdatering'
description: 'Välj en ansvarsperson för uppdatering av tjänsten som har utsetts till tjänstens ägare. Ansvarspersonen uppdaterar informationen om tjänsten och får systemmeddelanden om tjänsten till sin e-postadress. För sysselsättningsområdets egna tjänster kan serviceproducentens och kommunens ansvarsperson för uppdatering vara samma person.'
