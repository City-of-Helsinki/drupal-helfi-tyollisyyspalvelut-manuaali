langcode: fi
cancel_confirm:
  subject: 'Account cancellation request for [user:display-name] at [site:name]'
  body: "[user:display-name]\r\n\r\nA request to cancel your account has been made at [site:name].\r\n\r\nYou may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:\r\n\r\n[user:cancel-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires in one day and nothing will happen if it is not used.\r\n\r\n--  [site:name] team"
password_reset:
  subject: 'Palauta salasanasi Palvelumanuaalissa'
  body: "Pyysit käyttäjätilisi salasanan palauttamista Palvelumanuaalissa. Luo itsellesi uusi salasana alla olevan linkkipainikkeen kautta.\r\n\r\nKäyttäjätunnus: [user:mail]\r\n\r\nLuo itsellesi uusi salasana: [user:one-time-login-url]\r\n\r\nHuom! Linkki on kertakäyttöinen ja voimassa 14 päivää. Jos et pyytänyt salasanan palauttamista itse, voit jättää tämän viestin huomiotta."
register_admin_created:
  subject: 'Aktivoi käyttäjätilisi Palvelumanuaalissa'
  body: "Tervetuloa Palvelumanuaalin käyttäjäksi\r\n\r\nSinulle on luotu käyttäjätili Palvelumanuaaliin. Aktivoi tilisi ja luo itsellesi salasana alla olevan linkkipainikkeen kautta.\r\n\r\nKäyttäjätunnus: [user:mail]\r\n\r\nLuo salasana ja kirjaudu sisään: [user:one-time-login-url]\r\n\r\nHuom! Linkki on kertakäyttöinen ja voimassa 14 päivää. Jos et aktivoi tiliäsi 14 päivän sisällä, tili poistetaan. Ota tarvittaessa yhteyttä oman organisaatiosi pääkäyttäjään tai Palvelumanuaalin ylläpitoon osoitteessa: [site:mail]\r\n\r\nTutustu palvelun rekisteriselosteeseen: [site:base-url]/tietosuoja"
register_no_approval_required:
  subject: 'Aktivoi käyttäjätilisi Palvelumanuaalissa'
  body: "Tervetuloa Palvelumanuaalin käyttäjäksi\r\n\r\nSinulle on luotu käyttäjätili Palvelumanuaaliin. Aktivoi tilisi ja luo itsellesi salasana alla olevan linkkipainikkeen kautta.\r\n\r\nKäyttäjätunnus: [user:mail]\r\n\r\nLuo salasana ja kirjaudu sisään: [user:one-time-login-url]\r\n\r\nHuom! Linkki on kertakäyttöinen ja voimassa 14 päivää. Jos et aktivoi tiliäsi 14 päivän sisällä, tili poistetaan. Ota tarvittaessa yhteyttä oman organisaatiosi pääkäyttäjään tai Palvelumanuaalin ylläpitoon osoitteessa: [site:mail]\r\n\r\nTutustu palvelun rekisteriselosteeseen: [site:base-url]/tietosuoja"
register_pending_approval:
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
  body: "[user:display-name],\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\n--  [site:name] team"
register_pending_approval_admin:
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
  body: "[user:display-name] has applied for an account.\r\n\r\n[user:edit-url]"
status_activated:
  subject: 'Käyttäjätilisi on aktivoitu uudelleen Palvelumanuaalissa'
  body: "Käyttäjätilisi Palvelumanuaalissa on aktivoitu uudelleen. Aseta uusi salasana ja kirjaudu sisään sivustolle alla olevan linkin kautta.\r\n\r\nKäyttäjätunnus: [user:mail]\r\n\r\nAseta uusi salasana ja kirjaudu sisään teksti vie kertakirjautumislinkkiin: [user:one-time-login-url]\r\n\r\nHuom! Linkki on kertakäyttöinen ja voimassa 14 päivää."
status_blocked:
  subject: 'Account details for [user:display-name] at [site:name] (blocked)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
status_canceled:
  subject: 'Account details for [user:display-name] at [site:name] (canceled)'
  body: "[user:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
