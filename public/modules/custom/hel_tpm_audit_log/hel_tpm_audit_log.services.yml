parameters:
  # Entity types whose operations are written to the audit log.
  # Each item: { entity_type: 'node', bundle: 'article' (optional),
  # operations: ['ENTITY_READ', 'ENTITY_CREATE', ...] (optional) }.
  # Without 'operations' CREATE, UPDATE and DELETE are logged.
  hel_tpm_audit_log.audit_log_entity_types:
    - { entity_type: 'node' }
    - { entity_type: 'user' }
    # Provided by hel_tpm_contact_info; ignored when that module is disabled.
    - { entity_type: 'contact_info' }
    # Group module. Memberships are group_content (group relationship)
    # entities with one bundle per group type. A new group type needs its
    # membership bundle added here.
    - { entity_type: 'group' }
    # Organisation memberships.
    - { entity_type: 'group_content', bundle: 'organisation-group_membership' }
    # Service provider memberships.
    - { entity_type: 'group_content', bundle: 'group_content_type_a689b6d6f98cc' }

services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.hel_tpm_audit_log:
    parent: logger.channel_base
    arguments: ['hel_tpm_audit_log']

  # Adds a request id to the logger context (and X-Request-ID response
  # header). Same service id as in helfi_api_base so the middleware is not
  # registered twice if both modules are ever enabled.
  logger_extra.request_id_middleware:
    class: LoggerExtra\RequestIdMiddleware
    tags:
      - { name: http_middleware, priority: 250 }

  Drupal\hel_tpm_audit_log\AuditLog\AuditLogService:
    tags:
      - { name: needs_destruction }
  Drupal\hel_tpm_audit_log\AuditLog\AuditLogServiceInterface: '@Drupal\hel_tpm_audit_log\AuditLog\AuditLogService'

  Drupal\hel_tpm_audit_log\AuditLog\EventSubscriber\AuditLogActorSubscriber: ~
  Drupal\hel_tpm_audit_log\AuditLog\EventSubscriber\AuditLogRequestIdSubscriber: ~
  Drupal\hel_tpm_audit_log\AuditLog\EventSubscriber\AuditLogGroupMembershipSubscriber: ~
