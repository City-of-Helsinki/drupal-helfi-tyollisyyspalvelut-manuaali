field.widget.settings.hel_tpm_forms_simple_select2:
  type: field.widget.settings.options_select
  label: 'Simple Select2 widget settings'

field.widget.settings.hel_tpm_forms_language_radios:
  type: field.widget.settings.language_select
  label: 'Language radio buttons widget settings'
  mapping:
    option_labels:
      type: sequence
      label: 'Option labels'
      orderby: key
      sequence:
        type: label
        label: 'Option label'

field.widget.settings.auto_scheme_link_widget:
  type: field.widget.settings.link_default
  label: 'Auto scheme link widget settings'

field.widget.settings.limited_link_widget:
  type: field.widget.settings.link_default
  label: 'Limited Link widget settings'
  mapping:
    target_bundles:
      type: sequence
      label: 'Target bundles'
      orderby: key
      sequence:
        type: string
        label: 'Bundle'
    bypass_target_bundles_roles:
      type: sequence
      label: 'Bypass target bundles roles'
      orderby: key
      sequence:
        type: string
        label: 'Role'

field.widget.settings.hel_tpm_forms_link_custom_labels:
  type: field.widget.settings.auto_scheme_link_widget
  label: 'Link (custom labels) widget settings'
  mapping:
    uri_label:
      type: label
      label: 'URL label'
    uri_description:
      type: text
      label: 'URL description'
    title_label:
      type: label
      label: 'Link text label'
    title_description:
      type: text
      label: 'Link text description'
    add_more_label:
      type: label
      label: 'Add more button text'
